<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carpool Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one column, "next ride" first, then fairness tally, then the season list. Scoreboard type over a chalk-and-turf palette. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #17231d;
  --muted: #5d6b63;
  --line: #d9e0db;
  --accent: #1f7a4d;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1e8;
  --warn: #a35a00;
  --warn-soft: #fbefdc;
  --me: #fff3b0;
  --me-ink: #4a3b00;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101713; --surface: #18221c; --ink: #e6ede8; --muted: #9aaba1; --line: #2b3a31;
    --accent: #4cc48a; --accent-ink: #08130d; --accent-soft: #1d3428; --warn: #f0a94a; --warn-soft: #3a2a12;
    --me: #4a4115; --me-ink: #fff2b8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101713; --surface: #18221c; --ink: #e6ede8; --muted: #9aaba1; --line: #2b3a31;
  --accent: #4cc48a; --accent-ink: #08130d; --accent-soft: #1d3428; --warn: #f0a94a; --warn-soft: #3a2a12;
  --me: #4a4115; --me-ink: #fff2b8; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; line-height: 1.05; }
h2 { font-size: 22px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.meta { color: var(--muted); font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
select, input[type=text], input[type=date], input[type=time], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; color: var(--ink);
}
textarea { width: 100%; min-height: 70px; resize: vertical; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--warn); }
.btn.small { padding: 4px 9px; font-size: 14px; }
.linkish { background: none; border: none; color: var(--accent); padding: 0; text-decoration: underline; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.next { border: 2px solid var(--accent); display: grid; gap: 10px; }
.next .when { font-family: var(--font-display); font-size: 28px; line-height: 1; }
.next .legs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.next .leg { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
.next .leg .lbl { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.next .leg .who { font-family: var(--font-display); font-size: 26px; }
.note { background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); padding: 6px 10px; border-radius: 4px; font-size: 14px; white-space: pre-wrap; }

.tally { display: grid; gap: 10px; }
.trow { display: grid; grid-template-columns: 110px 1fr 120px; gap: 12px; align-items: center; }
.trow .name { font-weight: 700; overflow-wrap: anywhere; }
.bar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
.bar .done { background: var(--accent); }
.bar .up { background: var(--accent-soft); background-image: repeating-linear-gradient(45deg, transparent 0 5px, color-mix(in srgb, var(--accent) 25%, transparent) 5px 7px); }
.trow .fig { font-size: 14px; color: var(--muted); text-align: right; }
.diff { display: inline-block; min-width: 30px; text-align: center; border-radius: 999px; padding: 0 6px; font-size: 13px; font-weight: 700; margin-left: 6px; }
.diff.even { background: var(--accent-soft); color: var(--accent); }
.diff.over, .diff.under { background: var(--warn-soft); color: var(--warn); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line); }

.sched { display: grid; gap: 0; }
.shead, .srow { display: grid; grid-template-columns: 92px 1fr 1fr 1fr 40px; gap: 8px; align-items: center; padding: 8px 4px; }
.shead { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 2px solid var(--line); }
.srow { border-bottom: 1px solid var(--line); }
.srow .date { font-weight: 700; }
.wt { display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent); margin-left: 4px; }
.srow .date small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.srow.past { opacity: .5; }
.srow.isnext { background: var(--accent-soft); border-radius: 8px; border-bottom-color: transparent; }
.srow.cancelled .chips { grid-column: 2 / 5; color: var(--muted); font-style: italic; }
.srow .notecell { grid-column: 2 / 5; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 15px; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
button.chip:hover { border-color: var(--accent); }
.chip.mine { background: var(--me); color: var(--me-ink); border-color: transparent; font-weight: 700; }
.chip.off { border-style: dashed; color: var(--muted); }
.chip.picked { outline: 3px solid var(--accent); }
.mlabel { display: none; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 32px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; border-radius: 999px; padding: 1px 8px; background: var(--accent); color: var(--accent-ink); }

.swapbar { position: sticky; top: 0; z-index: 5; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.swapbar .btn { background: transparent; color: var(--bg); border-color: var(--bg); }

.status { font-size: 14px; color: var(--muted); }
.status.err { color: var(--warn); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 20; display: flex; gap: 14px; align-items: center; max-width: calc(100vw - 32px); }
.toast button { background: none; border: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }

dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg { padding: 18px; display: grid; gap: 14px; }
.dlg h3 { font-size: 24px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices .btn.current { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.list { display: grid; gap: 8px; }
.list .item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.list .item.kid { grid-template-columns: 1fr 1.6fr auto; }
.list input[type=text], .linkin { width: 100%; }
.help { font-size: 13px; color: var(--muted); }
details summary { cursor: pointer; font-weight: 700; }
.kids { display: grid; gap: 4px; font-size: 14px; }
.log { list-style: none; margin: 8px 0 0; padding: 0; }
.log li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; overflow-wrap: anywhere; }
.log li:last-child { border-bottom: none; padding-bottom: 0; }
.log .when { font-size: 12px; color: var(--muted); }

@media (max-width: 600px) {
  .shead { display: none; }
  .srow { grid-template-columns: 1fr 1fr 40px; grid-template-areas: "date date edit" "to home ."; row-gap: 6px; }
  .srow .date { grid-area: date; }
  .srow .c-to { grid-area: to; } .srow .c-home { grid-area: home; } .srow .c-off { display: none; }
  .srow .edit { grid-area: edit; }
  .srow.cancelled .chips { grid-column: 1 / 3; }
  .srow .notecell { grid-column: 1 / 3; }
  .mlabel { display: block; }
  .trow { grid-template-columns: 80px 1fr; }
  .trow .fig { grid-column: 1 / 3; text-align: left; }
  .log li { font-size: 14px; padding: 5px 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1 id="title">Carpool Planner</h1>
      <div class="meta" id="sub"></div>
    </div>
    <div class="controls" id="topControls"></div>
  </header>
  <div id="main"><p class="status" id="status">Connecting to the shared schedule…</p></div>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, writeBatch, deleteField, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

// ---------- helpers ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
const pad = n => String(n).padStart(2, "0");
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseD(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function isoOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtShort(s) { const d = parseD(s); return DOW[d.getDay()] + " " + (d.getMonth() + 1) + "/" + d.getDate(); }
function fmtLong(s) { const d = parseD(s); return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()] + ", " + MON[d.getMonth()] + " " + d.getDate(); }
function fmtMD(s) { const d = parseD(s); return MON[d.getMonth()] + " " + d.getDate(); }
function fmtStamp(d) { if (!d) return ""; const H = d.getHours(); return DOW[d.getDay()] + " " + (d.getMonth() + 1) + "/" + d.getDate() + ", " + (H % 12 || 12) + ":" + pad(d.getMinutes()) + (H >= 12 ? "pm" : "am"); }
function fmtTime(t) { if (!t) return ""; let [H, M] = t.split(":").map(Number); const ap = H >= 12 ? "pm" : "am"; H = H % 12 || 12; return H + (M ? ":" + pad(M) : "") + ap; }
function daysUntil(s) { return Math.round((parseD(s) - parseD(todayStr())) / 86400000); }
function uid(p) { return p + Math.random().toString(36).slice(2, 9); }
// Carpool ids are the secret in the link: 24 random URL-safe characters (144 bits).
function newCarpoolId() {
  const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  return "c_" + Array.from(crypto.getRandomValues(new Uint8Array(24)), b => abc[b & 63]).join("");
}
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
let toastTimer;
function toast(msg, onUndo) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = h("div", { class: "toast", role: "status" }, h("span", { text: msg }),
    onUndo ? h("button", { onclick: () => { t.remove(); onUndo(); }, text: "Undo" }) : null);
  document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), onUndo ? 8000 : 2600);
}

// ---------- state ----------
const db = getFirestore(initializeApp(firebaseConfig));
let currentId = null;         // from location.hash
let carpool = null, carpoolLoaded = false;
let rides = [];               // [{id, ...data}] for current carpool, sorted by date
let ridesLoaded = false, loadError = null;
let logEntries = [], logError = null; // latest 20 change-log entries, newest first
let unsubCarpool = null, unsubRides = null, unsubLog = null;
let swapFrom = null;          // {rideId, leg}
const dlg = document.getElementById("dlg"), dlgBody = document.getElementById("dlgBody");

const cp = () => carpool;
const parents = () => (cp() && Array.isArray(cp().parents)) ? cp().parents : [];
const activeParents = () => parents().filter(p => p.active !== false);
const pname = id => { const p = parents().find(x => x.id === id); return p ? (p.name || "Unnamed") : "—"; };
const meId = () => load("cp.me." + currentId);

// ---------- data ----------
function idFromHash() {
  let id = "";
  try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  return /^[A-Za-z0-9_-]{20,128}$/.test(id) ? id : null;
}

// Subscribe to the carpool named in the link. The carpools collection itself is never listed or queried.
function openFromHash() {
  if (unsubCarpool) unsubCarpool();
  if (unsubRides) unsubRides();
  if (unsubLog) unsubLog();
  unsubCarpool = unsubRides = unsubLog = null;
  currentId = idFromHash(); carpool = null; carpoolLoaded = false; rides = []; ridesLoaded = false; loadError = null; swapFrom = null;
  logEntries = []; logError = null;
  lastUndo = null; document.querySelectorAll(".toast").forEach(t => t.remove());
  closeDlg();
  render();
  if (!currentId) return;
  const id = currentId;
  const timer = setTimeout(() => { if (!carpoolLoaded) { loadError = "The schedule can't be reached yet. It will appear once the connection comes back."; render(); } }, 10000);
  unsubCarpool = onSnapshot(doc(db, "carpools", id), snap => {
    if (!snap.exists() && snap.metadata.fromCache) return; // wait for the server before saying "not found"
    clearTimeout(timer);
    carpool = snap.exists() ? snap.data() : null; carpoolLoaded = true; loadError = null; render();
  }, e => { clearTimeout(timer); loadError = "Couldn't load this carpool (" + e.code + ")."; render(); });
  unsubRides = onSnapshot(collection(db, "carpools", id, "rides"), snap => {
    rides = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    ridesLoaded = true; render();
  }, e => { loadError = "Couldn't load rides (" + e.code + ")."; render(); });
  unsubLog = onSnapshot(query(collection(db, "carpools", id, "log"), orderBy("at", "desc"), limit(20)), snap => {
    logEntries = snap.docs.map(d => d.data({ serverTimestamps: "estimate" })); logError = null; render();
  }, e => { logError = e.code; render(); });
}
window.addEventListener("hashchange", openFromHash);

async function write(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    if (e && e.code === "permission-denied") toast("Couldn't save: the change was rejected. Check what you entered and try again.");
    else toast("Couldn't save: " + ((e && e.message) || "try again"));
    return false;
  }
}
const rideData = r => { const d = Object.assign({}, r); delete d.id; return d; };
// New version of a ride: its latest data (not the copy a dialog was opened with) plus `patch`.
const edited = (r, patch) => Object.assign(rideData(rides.find(x => x.id === r.id) || r), patch, { updatedAt: new Date().toISOString() });
// A ride's weight: how many legs each of its two drives counts as (1 when not set).
const W_MIN = 0.5, W_MAX = 5;
const weightOf = r => typeof r.weight === "number" ? r.weight : 1;
const fmtN = n => String(Math.round(n * 10) / 10);
const wTag = r => weightOf(r) !== 1 ? h("span", { class: "wt", title: "Counts as " + fmtN(weightOf(r)) + " rides", text: "×" + fmtN(weightOf(r)) }) : null;
const legName = leg => leg === "to" ? "drive there" : "drive back";
const quote = s => "“" + (s.length > 80 ? s.slice(0, 79) + "…" : s) + "”";

// Fields that differ between two versions of a document (either may be null).
// Compared with keys sorted, since Firestore doesn't keep the key order of maps.
const canon = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map(key => [key, x[key]])) : x);
function changedKeys(a, b, skip) {
  return [...new Set([...Object.keys(a || {}), ...Object.keys(b || {})])].filter(k => k !== skip && canon((a || {})[k]) !== canon((b || {})[k]));
}
const pick = (o, keys) => o ? Object.fromEntries(keys.filter(k => k in o).map(k => [k, o[k]])) : null;

// The change log records who made a change by the viewer's "I am…" choice, if any.
function byName() { const p = parents().find(x => x.id === meId()); return p ? p.name : ""; }
const logEntry = (kind, summary, changes) => ({ at: serverTimestamp(), by: byName(), kind, summary: summary.slice(0, 1000), changes });
const newLogRef = cid => doc(collection(db, "carpools", cid, "log"));

// Every ride change goes through here: `next` lists the new version of each ride it touches
// ([rideId, data], data null to delete). The rides and a log entry are written in one batch.
// One level of undo: the rides' previous versions are kept and put back exactly if Undo is pressed.
let lastUndo = null;          // {cid, before: [[rideId, data | null]], summary}
async function change(next, kind, summary, okMsg, canUndo = true) {
  const cid = currentId, wb = writeBatch(db), changes = [];
  const before = next.map(([id]) => { const r = rides.find(x => x.id === id); return [id, r ? rideData(r) : null]; });
  next.forEach(([id, after], i) => {
    const prev = before[i][1], ref = doc(db, "carpools", cid, "rides", id);
    if (!after) { if (prev) wb.delete(ref); }
    else if (!prev) wb.set(ref, after);
    else {
      const keys = changedKeys(prev, after);
      if (keys.length) wb.update(ref, Object.fromEntries(keys.map(k => [k, k in after ? after[k] : deleteField()])));
    }
    const keys = prev && after ? changedKeys(prev, after, "updatedAt") : null;
    changes.push({ doc: "rides/" + id, before: keys ? pick(prev, keys) : prev, after: keys ? pick(after, keys) : after });
  });
  wb.set(newLogRef(cid), logEntry(kind, summary, changes));
  if (!await write(() => wb.commit())) return false;
  if (canUndo) { const u = lastUndo = { cid, before, summary }; toast(okMsg, () => undo(u)); }
  else toast(okMsg);
  return true;
}
async function undo(u) {
  if (lastUndo !== u || u.cid !== currentId) return;
  lastUndo = null;
  await change(u.before, "undo", "Undid: " + u.summary, "Undone.", false);
}

// Settings: update only the carpool fields that changed, with a log entry, in one batch.
async function changeCarpool(patch) {
  const c = cp(), keys = changedKeys(pick(c, Object.keys(patch)), patch);
  if (!keys.length) { toast("No changes to save."); return; }
  const cid = currentId, wb = writeBatch(db);
  wb.update(doc(db, "carpools", cid), pick(patch, keys));
  wb.set(newLogRef(cid), logEntry("settings", settingsSummary(c, patch, keys), [{ doc: "carpool", before: pick(c, keys), after: pick(patch, keys) }]));
  await write(() => wb.commit(), "Settings saved.");
}

function settingsSummary(c, patch, keys) {
  const parts = [];
  if (keys.includes("name")) parts.push("name changed to " + quote(patch.name));
  if (keys.includes("location")) parts.push(patch.location ? "location changed to " + quote(patch.location) : "location cleared");
  if (keys.includes("startTime") || keys.includes("endTime")) parts.push("times changed to " + ([fmtTime(patch.startTime), fmtTime(patch.endTime)].filter(Boolean).join("–") || "none"));
  if (keys.includes("parents")) {
    const was = c.parents || [], now = patch.parents;
    now.forEach(p => {
      const o = was.find(x => x.id === p.id);
      if (!o) parts.push("added " + p.name + " as a parent");
      else {
        if (o.name !== p.name) parts.push(o.name + " renamed to " + p.name);
        if ((o.active !== false) !== p.active) parts.push(p.name + (p.active ? " is driving again" : " stopped driving"));
      }
    });
    was.filter(o => !now.some(p => p.id === o.id)).forEach(o => parts.push("removed " + o.name));
  }
  if (keys.includes("kids")) {

// ---------- logic ----------
function tally() {
  const t = {}; activeParents().forEach(p => t[p.id] = { done: 0, up: 0 });
  parents().forEach(p => { if (!t[p.id]) t[p.id] = { done: 0, up: 0, inactive: true }; });
  const today = todayStr();
  rides.forEach(r => {
    if (r.cancelled) return;
    const w = weightOf(r);
    ["to", "home"].forEach(leg => { const id = r[leg]; if (!id || !t[id]) return; if (r.date < today) t[id].done += w; else t[id].up += w; });
  });
  return t;
}

// Assign upcoming, non-cancelled rides so totals end up as even as possible.
function planRebalance() {
  const today = todayStr(), act = activeParents();
  if (act.length < 2) return [];
  const total = {}, toN = {}, last = {};
  act.forEach((p, i) => { total[p.id] = 0; toN[p.id] = 0; last[p.id] = -1 - i; });
  rides.forEach((r, i) => {
    if (r.cancelled || r.date >= today) return;
    const w = weightOf(r);
    ["to", "home"].forEach(leg => { if (total[r[leg]] != null) { total[r[leg]] += w; if (leg === "to") toN[r[leg]] += w; last[r[leg]] = i; } });
  });
  const order = act.map(p => p.id), changes = [];
  rides.forEach((r, i) => {
    if (r.cancelled || r.date < today) return;
    const ranked = order.slice().sort((a, b) => total[a] - total[b] || last[a] - last[b] || order.indexOf(a) - order.indexOf(b));
    let [a, b] = ranked;
    let to = toN[a] <= toN[b] ? a : b, home = to === a ? b : a;
    const w = weightOf(r);
    total[a] += w; total[b] += w; toN[to] += w; last[a] = i; last[b] = i;
    if (r.to !== to || r.home !== home) changes.push({ id: r.id, to, home });
  });
  return changes;
}

  const st = h("input", { type: "time", id: "sStart", value: c.startTime || "" });
  const en = h("input", { type: "time", id: "sEnd", value: c.endTime || "" });
  const pList = h("div", { class: "list" }), kList = h("div", { class: "list" });
  function drawP() {
    pList.replaceChildren(...ps.map((p, i) => h("div", { class: "item" },
      h("input", { type: "text", "aria-label": "Parent name", id: "pn" + i, maxlength: "60", value: p.name, oninput: e => p.name = e.target.value }),
      h("label", { class: "row help", for: "pa" + i }, h("input", { type: "checkbox", id: "pa" + i, checked: p.active !== false, onchange: e => p.active = e.target.checked }), "Driving"))),
      h("button", { class: "btn small", onclick: () => { ps.push({ id: uid("p_"), name: "", active: true }); drawP(); }, text: "Add a parent" }));
  }
  function drawK() {
    kList.replaceChildren(...ks.map((k, i) => h("div", { class: "item kid" },
      h("input", { type: "text", "aria-label": "Kid name", id: "kn" + i, maxlength: "60", value: k.name, oninput: e => k.name = e.target.value }),
      h("input", { type: "text", "aria-label": "Pickup address", id: "ka" + i, maxlength: "200", value: k.address || "", placeholder: "Pickup address", oninput: e => k.address = e.target.value }),
      h("button", { class: "btn small danger", onclick: () => { ks.splice(i, 1); drawK(); }, text: "Remove" }))),
      h("button", { class: "btn small", onclick: () => { ks.push({ id: uid("k_"), name: "", address: "" }); drawK(); }, text: "Add a kid" }));
  }
  drawP(); drawK();
  openDlg(h("h3", { text: "Carpool settings" }),
    h("label", { class: "field", for: "sName" }, "Name", name), h("label", { class: "field", for: "sLoc" }, "Location", loc),
    h("div", { class: "row" }, h("label", { class: "field", for: "sStart" }, "Starts", st), h("label", { class: "field", for: "sEnd" }, "Ends", en)),
    h("div", null, h("strong", { text: "Parents who drive" }), h("p", { class: "help", text: "Untick someone who has stopped driving; their past rides stay on record. After adding or removing a driver, use Rebalance so the new rotation is even." }), pList),
    h("div", null, h("strong", { text: "Kids" }), kList),
    h("div", { class: "row", style: "justify-content:space-between" }, h("button", { class: "btn", onclick: () => { closeDlg(); setTimeout(openRebalance, 0); }, text: "Rebalance upcoming…" }),
      h("div", { class: "row" }, h("button", { class: "btn", onclick: closeDlg, text: "Cancel" }), h("button", { class: "btn primary", onclick: async () => {
        ps = ps.filter(p => p.name.trim()).map(p => ({ id: p.id, name: p.name.trim(), active: p.active !== false }));
        ks = ks.filter(k => k.name.trim()).map(k => ({ id: k.id || uid("k_"), name: k.name.trim(), address: (k.address || "").trim() }));
        closeDlg(); await changeCarpool({ name: name.value.trim() || "Carpool", location: loc.value.trim(), startTime: st.value, endTime: en.value, parents: ps, kids: ks });
      }, text: "Save" }))));
}

function openNewCarpool() {
  const nm = h("input", { type: "text", id: "nName", maxlength: "100", placeholder: "e.g. Swim team practice" });
  const loc = h("input", { type: "text", id: "nLoc", maxlength: "200" });
  const st = h("input", { type: "time", id: "nStart" }), en = h("input", { type: "time", id: "nEnd" });
  const pp = h("textarea", { id: "nParents", placeholder: "One name per line" });
  const d1 = h("input", { type: "date", id: "nFirst" }), d2 = h("input", { type: "date", id: "nLast" });
  const err = h("p", { class: "status err" });
  openDlg(h("h3", { text: "New carpool" }),
    h("label", { class: "field", for: "nName" }, "Name", nm), h("label", { class: "field", for: "nLoc" }, "Location", loc),
    h("div", { class: "row" }, h("label", { class: "field", for: "nStart" }, "Starts", st), h("label", { class: "field", for: "nEnd" }, "Ends", en)),
    h("label", { class: "field", for: "nParents" }, "Parents who drive", pp),
    h("div", { class: "row" }, h("label", { class: "field", for: "nFirst" }, "First date", d1), h("label", { class: "field", for: "nLast" }, "Last date", d2)),
    h("p", { class: "help", text: "Repeats weekly on the first date's weekday. Drivers are rotated evenly; you can skip or move individual days afterwards. The carpool gets its own private link to share with the other parents." }),
    err,
    h("div", { class: "row end" }, h("button", { class: "btn", onclick: closeDlg, text: "Cancel" }), h("button", { class: "btn primary", onclick: async () => {
      const names = pp.value.split("\n").map(s => s.trim().slice(0, 60)).filter(Boolean);
      if (!nm.value.trim()) { err.textContent = "Give the carpool a name."; return; }
      if (names.length < 2) { err.textContent = "Add at least two parents."; return; }
      if (!d1.value || !d2.value || d2.value < d1.value) { err.textContent = "Pick a first and last date, in order."; return; }
      const ps = names.map(n => ({ id: uid("p_"), name: n, active: true }));
      const dates = []; for (let d = parseD(d1.value); isoOf(d) <= d2.value && dates.length < 60; d.setDate(d.getDate() + 7)) dates.push(isoOf(d));
      const id = newCarpoolId(), now = new Date().toISOString();
      closeDlg();
      const ok = await write(() => {
        const wb = writeBatch(db);
        wb.set(doc(db, "carpools", id), { name: nm.value.trim(), location: loc.value.trim(), startTime: st.value, endTime: en.value, parents: ps, kids: [], createdAt: now });
        for (let i = 0; i < dates.length; i++) {
          const a = ps[(2 * i) % ps.length].id, b = ps[(2 * i + 1) % ps.length].id;
          wb.set(doc(db, "carpools", id, "rides", dates[i]), { date: dates[i], to: a, home: b === a ? ps[(2 * i + 2) % ps.length].id : b, cancelled: false, note: "", updatedAt: now });
        }
        return wb.commit();
      }, "Carpool created. Use Copy link to share it.");
      if (ok) location.hash = id;
    }, text: "Create" })));
}

document.addEventListener("keydown", e => { if (e.key === "Escape" && swapFrom) { swapFrom = null; render(); } });
openFromHash();
